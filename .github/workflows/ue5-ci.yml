name: UE5 CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      runner_labels:
        description: 'JSON array for runs-on labels, e.g. ["self-hosted","windows","ue5"]'
        required: false
        default: '["self-hosted","windows","ue5"]'

env:
  PROJECT_FILE: "D:\\Epic Games\\UEPro\\CodexGame\\CodexGame.uproject"
  UE_ROOT: "D:\\Epic Games\\UEPro\\UE_5.4"
  BUILD_CONFIG: "Development"
  BUILD_PLATFORM: "Win64"
  ARCHIVE_DIR: "D:\\Epic Games\\UEPro\\CodexGame\\Artifacts"
  TEST_REPORT_DIR: "D:\\Epic Games\\UEPro\\CodexGame\\Saved\\Automation\\Reports"

jobs:
  workflow-quick-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Workflow Syntax (actionlint)
        uses: reviewdog/action-actionlint@v1

      - name: Confirm Workflow File Exists
        run: test -f .github/workflows/ue5-ci.yml

  build-test-deploy:
    needs: workflow-quick-check
    runs-on: ${{ fromJSON(github.event.inputs.runner_labels || '["self-hosted","windows","ue5"]') }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Runner Context
        shell: powershell
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner os: $env:RUNNER_OS"
          Write-Host "UE root: $env:UE_ROOT"
          Write-Host "Project file: $env:PROJECT_FILE"

      - name: Check UE Toolchain
        shell: powershell
        run: |
          $BuildBat = Join-Path $env:UE_ROOT "Engine\\Build\\BatchFiles\\Build.bat"
          $UATBat = Join-Path $env:UE_ROOT "Engine\\Build\\BatchFiles\\RunUAT.bat"
          $EditorCmd = Join-Path $env:UE_ROOT "Engine\\Binaries\\Win64\\UnrealEditor-Cmd.exe"

          if (!(Test-Path $BuildBat)) { throw "Build.bat not found: $BuildBat" }
          if (!(Test-Path $UATBat)) { throw "RunUAT.bat not found: $UATBat" }
          if (!(Test-Path $EditorCmd)) { throw "UnrealEditor-Cmd.exe not found: $EditorCmd" }
          if (!(Test-Path $env:PROJECT_FILE)) { throw "Project file not found: $env:PROJECT_FILE" }
          Write-Host "UE toolchain detected. Strict deployment mode enabled."

      - name: Build Editor
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:UE_ROOT\Engine\Build\BatchFiles\Build.bat" CodexGameEditor $env:BUILD_PLATFORM $env:BUILD_CONFIG -Project="$env:PROJECT_FILE" -WaitMutex -FromMsBuild

      - name: Run Automation Tests
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path $env:TEST_REPORT_DIR -Force | Out-Null
          & "$env:UE_ROOT\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "$env:PROJECT_FILE" `
            -unattended -NullRHI -NoSplash -NoSound `
            -ExecCmds="Automation RunTests CodexGame.ChessAI.AttackBehavior;Quit" `
            -TestExit="Automation Test Queue Empty" `
            -ReportOutputPath="$env:TEST_REPORT_DIR" `
            -log

      - name: Package (BuildCookRun)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path $env:ARCHIVE_DIR -Force | Out-Null
          & "$env:UE_ROOT\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun `
            -project="$env:PROJECT_FILE" `
            -noP4 `
            -platform=$env:BUILD_PLATFORM `
            -clientconfig=$env:BUILD_CONFIG `
            -build -cook -stage -pak -archive `
            -archivedirectory="$env:ARCHIVE_DIR"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codexgame-windows-package
          path: D:\Epic Games\UEPro\CodexGame\Artifacts
          if-no-files-found: error

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codexgame-automation-report
          path: D:\Epic Games\UEPro\CodexGame\Saved\Automation\Reports
          if-no-files-found: warn
